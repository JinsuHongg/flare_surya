# @package _global_

data:
  train_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/train_C2w_freq24.csv
  valid_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/val_C2w.csv
  leaky_valid_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/leaky_val_C2w.csv
  test_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/test_C2w_freq4.csv

backbone:
  model_name: alexnet # resnet18, resnet34, resnet50, alexnet,

loss:
  type: cross_entropy
  cross_entropy:
    class_weights: [1.0, 2.0]
  focal:
    alpha: 0.25
    gamma: 2.0
    reduction: mean

etc:
  phase: test # test
  resume: true
  ckpt_dir: ./results/checkpoints/baselines/alexnet/8hour_c2w/
  ckpt_name_tag: alexnet_8hour_c2w_ce_nosample
  ckpt_file: alexnet_8hour_c2w_ce_nosample_lr0.0001_wd0.001_epoch=7.ckpt
  ckpt_weights_only: false
  save_test_results_path: ./results/alexnet_c2w_8hour_test_result.csv

wandb:
  name: alexnet_8hour_c2w_test
  id: alexnet_8hour_c2w_test
  resume: allow
  project: flareforecasting-nosampling-test
  group: alexnet
  offline: false
  notes: ""
  tag: ["alexnet", "C2w", "nasgh", "8hour", "cross_entropy", "nosampling", "test"] # backbone model, head type, task
