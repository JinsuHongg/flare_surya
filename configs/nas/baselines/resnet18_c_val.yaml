# @package _global_

data:
  train_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/train_C2w_freq24.csv
  valid_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/val_C2w.csv
  leaky_valid_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/leaky_val_C2w.csv
  test_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/val_C2w.csv
  apply_undersampling: false
  undersample_factor: 1
  seed: 1004

backbone:
  model_name: resnet18 # resnet18, resnet34, resnet50, alexnet,

loss:
  type: cross_entropy
  cross_entropy:
    class_weights: [1.0, 2.0]
  focal:
    alpha: 0.25
    gamma: 2.0
    reduction: mean

optimizer:
  type: adamw
  lr: 1e-4
  weight_decay: 1e-2

etc:
  phase: test # test
  resume: true
  ckpt_dir: ./results/checkpoints/baselines/resnet18/daily_c2w/
  ckpt_name_tag: resnet18_daily_c2w_test
  ckpt_file: resnet18_daily_c2w_ce_nosample_groupnorm_lr1e-05_wd0.001_epoch=12.ckpt
  ckpt_weights_only: false
  save_test_results_path: ./results/val_resnet18_daily_c2w_predictions.csv

wandb:
  name: resnet18_daily_c2w_val_inference
  id: resnet18_daily_c2w_val_inference
  resume: allow
  project: flareforecasting-validation-inference
  group: resnet18
  offline: true
  notes: "Validation prediction recovery via baseline test pipeline"
  tag: ["resnet18", "C2w", "nasgh", "daily", "val_inference"]
