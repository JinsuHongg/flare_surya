# @package _global_

data:
  train_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/train_M2w_freq8.csv
  valid_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/val_M2w.csv
  leaky_valid_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/leaky_val_M2w.csv
  test_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/test_M2w_freq4.csv
  apply_undersampling: false
  undersample_factor: 1
  seed: 1004

backbone:
  model_name: resnet18 # resnet18, resnet34, resnet50, alexnet,

loss:
  type: cross_entropy
  cross_entropy:
    class_weights: [1.0, 2.0]
  focal:
    alpha: 0.25
    gamma: 2.0
    reduction: mean

optimizer:
  type: adamw
  lr: 1e-5
  weight_decay: 1e-3

etc:
  phase: test # test
  resume: true
  ckpt_dir: ./results/checkpoints/baselines/resnet18/2hour_m2w/
  ckpt_name_tag: resnet18_2hour_m2w_test
  ckpt_file: resnet18_2hour_m2w_ce_nosample_groupnorm_lr1e-05_wd0.001_epoch=21.ckpt
  ckpt_weights_only: false
  save_test_results_path: ./results/test_results/resnet18_m2w_2hour_test_result.csv

wandb:
  name: resnet18_2hour_m2w_test
  id: resnet18_2hour_m2w_test
  resume: allow
  project: flareforecasting-nosampling-test
  group: resnet18
  offline: false
  notes: ""
  tag: ["resnet18", "M2w", "nasgh", "2hour", "test"] # backbone model, head type, task

