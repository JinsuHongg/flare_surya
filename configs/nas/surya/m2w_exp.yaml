# @package _global_

data:
  train_flare_data_path: ./data/surya-bench-flare-forecasting/M24w/train_M24w.csv
  valid_flare_data_path: ./data/surya-bench-flare-forecasting/M24w/val_M24w.csv
  leaky_valid_flare_data_path: ./data/surya-bench-flare-forecasting/M24w/leaky_val_M24w.csv
  test_flare_data_path: ./data/surya-bench-flare-forecasting/M24w/test_M24w.csv
  apply_undersampling: true
  undersample_factor: 1
  seed: 1004

backbone:
  pooling_type: attention_pooling

loss:
  type: cross_entropy
  cross_entropy:
    class_weights: [1.0, 2.0]
  focal:
    alpha: 0.75
    gamma: 2.0
    reduction: mean
    label_smoothing: 0.2

optimizer:
  type: adamw
  lr: 1e-5
  weight_decay: 0.03

etc:
  phase: train # test
  resume: false
  ckpt_dir: /nobackupnfs1/sroy14/heliofm/jinsu/checkpoints/surya/3hour_m24w/
  ckpt_name_tag: mlp_3hour_m24w_ce_undersample
  ckpt_file: last.ckpt
  ckpt_weights_only: false
  max_epochs: 50

wandb:
  name: mlp_3hour_m24w_ce_undersample_nasgh
  id: mlp_3hour_m24w_ce_undersample_nasgh
  resume: allow
  project: flareforecasting-undersampling
  group: surya
  notes: ""
  offline: false
  tag: ["mlp", "M24w", "3hour", "nasgh", "cross_entropy"] # backbone model, head type, task
