# @package _global_

data:
  train_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/train_M2w_freq2.csv
  valid_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/val_M2w.csv
  leaky_valid_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/leaky_val_M2w.csv
  test_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/test_M2w.csv
  apply_undersampling: true
  undersample_factor: 4
  seed: 1004

backbone:
  pooling_type: attention_pooling

loss:
  type: cross_entropy
  cross_entropy:
    class_weights: [1.0, 2.0]
  focal:
    alpha: 0.75
    gamma: 2.0
    reduction: mean
    label_smoothing: 0.2

optimizer:
  type: adamw
  lr: 1e-5
  weight_decay: 0.03

etc:
  phase: train # test
  resume: true
  ckpt_dir: /nobackupnfs1/sroy14/heliofm/jinsu/checkpoints/2hour_m2w/
  ckpt_name_tag: mlp_2hour_m2w_ce_undersample
  ckpt_file: last.ckpt
  ckpt_weights_only: false
  max_epochs: 50

wandb:
  name: mlp_2hour_m2w_ce_undersample_nasgh
  id: mlp_2hour_m2w_ce_undersample_nasgh
  resume: allow
  project: surya-flare-2hwindow-undersample
  group: surya
  notes: ""
  offline: false
  tag: ["mlp", "M2w", "2hour", "nasgh", "cross_entropy"] # backbone model, head type, task
