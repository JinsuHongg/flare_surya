  phase: test # test
  resume: true
  ckpt_dir: /nobackupnfs1/sroy14/heliofm/jinsu/checkpoints/surya/8hour_c2w/
  ckpt_name_tag: null
  ckpt_file: mlp_8hour_c2w_ce_nosample_lr0.00015_wd0.03_epoch=3.ckpt
  ckpt_weights_only: false
  save_test_results_path: ./results/test_results/surya_8hour_c2w_ce_nosample.csv

wandb:
  name: mlp_8hour_c2w_ce_nosample_nasgh_test
  id: mlp_8hour_c2w_ce_nosample_nasgh_test
  resume: allow
  project: flareforecasting-nosampling-test
