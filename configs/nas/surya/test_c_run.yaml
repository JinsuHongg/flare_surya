# @package _global_

data:
  train_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/train_C2w.csv
  valid_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/val_C2w.csv
  leaky_valid_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/leaky_val_C2w.csv
  test_flare_data_path: ./data/surya-bench-flare-forecasting/C2w/test_C2w_freq4.csv
  apply_undersampling: false
  undersample_factor: 1
  seed: 1004

backbone:
  pooling_type: attention_pooling

loss:
  type: cross_entropy
  cross_entropy:
    class_weights: [1.0, 2.0]
  focal:
    alpha: 0.25
    gamma: 2.0
    reduction: mean

