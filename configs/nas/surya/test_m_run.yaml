# @package _global_

data:
  train_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/train_M2w_freq24.csv
  valid_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/val_M2w.csv
  leaky_valid_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/leaky_val_M2w.csv
  test_flare_data_path: ./data/surya-bench-flare-forecasting/M2w/test_M2w_freq4.csv
  apply_undersampling: false
  undersample_factor: 1
  seed: 1004

backbone:
  pooling_type: attention_pooling

loss:
  type: cross_entropy
  cross_entropy:
    class_weights: [1.0, 2.0]
  focal:
    alpha: 0.25
    gamma: 2.0
    reduction: mean

optimizer:
  lr: 1.5e-5
  weight_decay: 0.03

etc:
  phase: test # test
  resume: true
  ckpt_dir: /nobackupnfs1/sroy14/heliofm/jinsu/checkpoints/surya/3hour_m2w
  ckpt_name_tag: mlp_3hour_m2w_ce_nosample
  ckpt_file: mlp_3hour_m2w_ce_undersample_lr1e-05_wd0.03_epoch=21.ckpt
  ckpt_weights_only: false
  save_test_results_path: ./results/surya_3hour_m2w_ce_nosample.csv

wandb:
  name: mlp_3hour_m2w_ce_nosample_nasgh_test
  id: mlp_3hour_m2w_ce_nosample_nasgh_test
  resume: allow
  project: flareforecasting-nosampling-test
  group: surya
  offline: false
  notes: ""
  tag: ["mlp", "M2w", "3hour", "nasgh", "cross_entropy", "undersampling"] # backbone model, head type, task
